name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (node target)
        run: npm run build

      - name: Package extension
        run: npm run package

      # Publishes to the Open VSX Registry under the ducks-project namespace.
      # OVSX_TOKEN must be configured as a repository secret; it is referenced
      # here, never hard-coded.
      - name: Publish to Open VSX
        run: npm run publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_TOKEN }}
